---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-prod-pods-reader
rules:
  # Cluster-wide pod reads back both the dashboard's health readouts and the
  # preview orchestrator's readiness wait (Up polls a preview-<tag>
  # namespace's pods before it will mark the preview ready — see
  # waitForPods in internal/preview/orchestrator.go). Narrowing this to
  # specific namespaces would break previews silently: their namespaces are
  # dynamically named, so a 403 would only show up against the real cluster,
  # never in tests.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bifrost-prod-pods-reader
subjects:
  - kind: ServiceAccount
    name: bifrost-prod-ksa
    namespace: bifrost-prod
roleRef:
  kind: ClusterRole
  name: bifrost-prod-pods-reader
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped (not a Role in the argocd namespace) because the
# kustomization's global `namespace:` transformer would rewrite a namespaced
# Role/RoleBinding into bifrost-prod, silently breaking promote RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-prod-argocd-app-patcher
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bifrost-prod-argocd-app-patcher
subjects:
  - kind: ServiceAccount
    name: bifrost-prod-ksa
    namespace: bifrost-prod
roleRef:
  kind: ClusterRole
  name: bifrost-prod-argocd-app-patcher
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped for the same kustomize-transformer reason as
# argocd-app-patcher above, plus a reason specific to this role: previews
# live in dynamically-named preview-<tag> namespaces, and the orchestrator
# also reads shared secrets out of every <service>-staging namespace and the
# previews namespace. RBAC has no way to pattern-match namespace names, so
# there's no single namespaced Role that could cover the set of namespaces
# this role actually touches. The grant below is therefore cluster-wide;
# the real scoping (preview-* writes, *-staging/previews reads) happens in
# application logic — see internal/preview/orchestrator.go and
# internal/kube/apply.go — not in this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bifrost-prod-preview-orchestrator
rules:
  # EnsureNamespace (Get, then Create-or-Update) and AnnotateNamespace (Get,
  # then Update) manage the preview-<tag> namespace itself; DeleteNamespace
  # (Delete) tears it down on preview teardown. See EnsureNamespace,
  # AnnotateNamespace, DeleteNamespace in internal/kube/apply.go.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "update", "delete"]
  # CopySecret (Get, then Create-or-Update) copies each app's
  # <service>-staging secret and the shared previews wildcard-TLS secret
  # into the preview namespace: reads span *-staging and previews
  # namespaces, writes span preview-* namespaces. See CopySecret in
  # internal/kube/apply.go.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  # ApplyObjects server-side-applies every rendered preview manifest
  # (fieldManager "bifrost-preview", Force: true) into the preview
  # namespace via a single PATCH per object (applyOne/ri.Apply) — it never
  # Gets these kinds first, so no "get" is granted here. "patch" covers the
  # SSA request itself; "create" covers first-apply on objects that don't
  # exist yet. These are exactly the kinds render.go produces — see
  # internal/preview/render.go and applyOne in internal/kube/apply.go.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "create"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["patch", "create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["patch", "create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["patch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bifrost-prod-preview-orchestrator
subjects:
  - kind: ServiceAccount
    name: bifrost-prod-ksa
    namespace: bifrost-prod
roleRef:
  kind: ClusterRole
  name: bifrost-prod-preview-orchestrator
  apiGroup: rbac.authorization.k8s.io
