# The bifrost fleet: every service bifrost operates on. Adding an app is a
# single entry here — its repo name (only needed when it differs from the
# service name) and its public staging/prod URLs for the "open ↗" links on
# its service card. `preview:` is an optional sub-block, present only for
# services onboarded to preview environments; see its own header comment
# below for how a preview's env values resolve.
#
# comms has no urls: it's a background worker with no ingress, so there's no
# public staging/prod URL to link to.
asset-manager:
  repo: asset_manager
  urls:
    staging: https://assets-staging.tailc06f30.ts.net
    prod: https://assets.ethanswan.com

bifrost:
  urls:
    staging: https://bifrost-staging.tailc06f30.ts.net
    prod: https://bifrost.ethanswan.com

comms: {}

forecasting:
  urls:
    staging: https://forecasting-staging.tailc06f30.ts.net
    prod: https://forecasting.ethanswan.com

# Previewable services. Adding one here + a cloudbuild-preview.yaml and
# {service}-preview-build trigger in its repo is the whole onboarding path —
# no Go changes. Templates resolve by cascade, stopping at the first hit:
#   1. X is part of this preview -> X's preview URL ({{ url X }}) or its
#      in-cluster preview DNS ({{ internalUrl X }}).
#   2. else the key already has a value in the staging ConfigMap of the app
#      being rendered -> that value is kept untouched. This is why editing
#      this registry's urls.staging does NOT change a key an app already
#      sets: the app's own config wins, so the two can't drift apart.
#   3. else this registry's urls.staging for X, or the
#      X.X-staging.svc.cluster.local convention for {{ internalUrl }} (the
#      path a service with no staging ConfigMap takes, e.g.
#      footstrike-dashboard).
#   4. else an error naming the key and the unresolvable service.
# {{ config KEY }} is an operator-supplied value from bifrost's config.
# Neon references live here and never come from the branch under test.
footstrike-api:
  urls:
    staging: https://api.staging.footstrike.run
    prod: https://api.footstrike.run
  preview:
    neon:
      project: aged-river-81935268
      database: neondb
      role: neondb_owner
      # Cut previews from staging's branch, NOT this project's Neon default.
      # Omitting parent: means "Neon's default branch", which here is
      # `production` — so every preview used to come up as a copy-on-write
      # clone of PRODUCTION data, on production's schema. Two things were
      # wrong with that: previews carried real user data nobody intended to
      # hand out with a preview URL, and because promotion to prod is manual,
      # they started on a schema BEHIND staging — so a preview of a branch
      # whose migration was already live in staging replayed migrations that
      # staging had long since applied.
      #
      # `development` is footstrike-api's staging branch. Verified by matching
      # the endpoint ID inside the `footstrike_api_staging_database_url`
      # secret against this project's Neon endpoints, not by trusting the
      # branch's name — the name and the deployment can disagree, and only the
      # endpoint says which branch staging actually talks to. Re-verify that
      # way if this ever changes; a wrong-but-existing name here fails
      # silently in the only way that matters (the preview simply branches the
      # wrong data).
      parent: development
    env:
      ENV: staging
      PUBLIC_API_BASE_URL: "{{ url self }}"
      PUBLIC_DASHBOARD_BASE_URL: "{{ url footstrike-dashboard }}"
      IDENTITY_PROVIDER_URL: "{{ internalUrl identity }}"
      JWT_ISSUER: "{{ url identity }}"
    # Bare "alembic", not "uv run alembic": the runtime image's final stage
    # only copies /app (the built venv) from the builder, never the uv/uvx
    # binaries the builder stage placed in /bin — uv isn't on PATH here.
    # /app/.venv/bin (where `uv sync` installs alembic's entry-point script)
    # is on PATH via the image's own ENV, and footstrike-api's own CronJob
    # (k8s/base/cronjob.yaml, command: ["fitapi-purge"]) already runs its
    # entry-point scripts the same bare way. Verified against
    # footstrike-api/Dockerfile.
    migrate: ["alembic", "upgrade", "head"]

footstrike-dashboard:
  urls:
    staging: https://staging.footstrike.run
    prod: https://footstrike.run
  preview:
    env:
      APP_API_URL: "{{ url footstrike-api }}"
      APP_IDENTITY_URL: "{{ url identity }}"
      APP_OAUTH_CLIENT_ID: "{{ config previewOAuthClientID }}"
    required: [APP_API_URL, APP_IDENTITY_URL, APP_OAUTH_CLIENT_ID]

identity:
  urls:
    staging: https://identity-staging.tailc06f30.ts.net
    prod: https://identity.ethanswan.com
  preview:
    neon:
      project: plain-heart-27630935
      database: neondb
      role: app
      # Staging's branch, for the same reason footstrike-api's parent: exists
      # above (read that comment first — it explains why the Neon default is
      # the wrong parent). identity's default branch is `production` too, so
      # without this key its previews clone production identity data.
      #
      # Confirmed to be staging's branch by matching the endpoint ID in the
      # `identity_staging_database_url` secret against this project's
      # endpoints. That it is spelled the same as footstrike-api's is a
      # coincidence of two projects being set up alike, not a convention:
      # forecasting's equivalent pair is `dev`/`main`. Check the endpoint,
      # never the name, when adding the next one.
      parent: development
    # Absolute "/app/auth-service", NOT bare "auth-service" like
    # footstrike-api's bare "alembic" above: identity's Dockerfile sets
    # WORKDIR /app and copies the binary to /app/auth-service
    # (COPY --from=builder /build/auth-service .), but never adds /app to
    # PATH via ENV the way footstrike-api's image puts .venv/bin on PATH. A
    # bare "auth-service" here would fail the initContainer immediately with
    # "executable file not found in $PATH", before the migrate subcommand
    # ever ran. Verified against identity/Dockerfile.
    migrate: ["/app/auth-service", "migrate"]
    env:
      JWT_ISSUER: "{{ url self }}"
